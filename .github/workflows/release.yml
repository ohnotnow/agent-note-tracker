name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Publishing waits for this, so a tag cannot ship a build that fails the
  # tests. Releases use the current stable Go, not the go.mod minimum, so
  # binaries pick up compiler and standard library security fixes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          LDFLAGS: -s -w -X github.com/ohnotnow/agent-note-tracker/internal/ant.Version=${{ github.ref_name }}
        run: |
          mkdir -p dist
          # macOS
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-darwin-amd64 ./cmd/ant
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ant-darwin-arm64 ./cmd/ant

          # Linux
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-linux-amd64 ./cmd/ant
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ant-linux-arm64 ./cmd/ant

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-windows-amd64.exe ./cmd/ant

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
