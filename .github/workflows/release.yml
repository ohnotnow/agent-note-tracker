name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          LDFLAGS: -s -w -X agent-note-tracker/internal/ant.Version=${{ github.ref_name }}
        run: |
          mkdir -p dist
          # macOS
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ant-darwin-arm64 .

          # Linux
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ant-linux-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ant-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
